<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Drift — Foundation</title>
    <script>
      // Set the theme before first paint to avoid a flash. Mirrors the default
      // resolution in src/lib/theme.ts; kept tiny and dependency-free.
      (function () {
        try {
          // Dark is Drift's default; honour an explicit stored choice.
          var t = localStorage.getItem("drift-theme") || "dark";
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
