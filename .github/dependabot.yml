# Two manifests, because the client is a standalone package with its own
# lockfile: the service's Playwright and BullMQ graph is deliberately kept out
# of anything a browser downloads.
#
# Weekly and grouped, so a review is one pull request rather than nine.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # These three move together or not at all: the queue is BullMQ over Redis,
      # and the crawler is Playwright driving a browser build pinned by it.
      runtime:
        patterns: ['bullmq', 'playwright', '@playwright/*', 'express', 'ws']
      haus:
        patterns: ['haus-*']
      # The test runner is its own group. Grouped with the linters, one vitest
      # major holds five eslint patches behind it.
      test:
        patterns: ['vitest', '@vitest/*']
      tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier*', 'tsx']
    commit-message:
      prefix: 'deps'
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 is the native rewrite, deferred across every repo here so
      # they move together. Recorded rather than closed: a closed pull request
      # comes back on the next run and says nothing about why it was refused.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      haus:
        patterns: ['haus-*']
      test:
        patterns: ['vitest', '@vitest/*', 'jsdom', '@testing-library/*']
      tooling:
        patterns: ['vite', '@vitejs/*', 'eslint*', '@eslint/*', 'typescript-eslint']
    commit-message:
      prefix: 'deps'
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
