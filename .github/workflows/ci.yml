name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      # `@haus/colour-utils` is a file: dependency on a sibling checkout, so the
      # runner has to reproduce the local layout: haus next to drift.
      - name: Check out drift
        uses: actions/checkout@v4
        with:
          path: drift

      - name: Check out haus (provides @haus/colour-utils)
        uses: actions/checkout@v4
        with:
          repository: hipuku/haus
          token: ${{ secrets.GH_PAT }}
          path: haus

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build colour-utils
        working-directory: haus/packages/colour-utils
        run: |
          npm install
          npm run build --if-present

      - name: Install backend
        working-directory: drift
        run: npm install

      - name: Typecheck backend
        working-directory: drift
        run: npm run typecheck

      # No Redis service container: the suite is unit-level and only parses the
      # connection URL. The BDD suite in drift-tests is what needs a live Redis.
      - name: Test backend
        working-directory: drift
        run: npm test

      - name: Install client
        working-directory: drift/client
        run: npm install

      - name: Build client
        working-directory: drift/client
        run: npm run build
