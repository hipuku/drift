name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend
        run: npm ci

      - name: Typecheck backend
        run: npm run typecheck

      # No Redis service container: the suite is unit-level and only parses the
      # connection URL. The BDD suite in drift-tests is what needs a live Redis.
      - name: Test backend
        run: npm test

      - name: Install client
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build
