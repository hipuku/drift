name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install backend
        run: npm ci

      # One config at the root covers both halves: the service under src/ and
      # the client under client/src/.
      - name: Lint
        run: npm run lint

      - name: Typecheck backend
        run: npm run typecheck

      - name: Test backend
        run: npm test

      - name: Install client
        working-directory: client
        run: npm ci

      - name: Test client
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build

      # End to end, against the built demo bundle. Every other test here stops
      # at a component or an HTTP call: this is the only one that drives the
      # product the way a reader will.
      - name: Install Playwright
        working-directory: client
        run: npx playwright install chromium --with-deps

      - name: End-to-end
        working-directory: client
        run: npm run e2e

      - name: Keep the trace when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
