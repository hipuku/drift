name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: CI checks code, it never writes to the repo.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# One job per check, named exactly as the main ruleset requires them, so a
# failure says which check broke and each can be required on its own.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # One config at the root covers both halves: the service under src/ and
      # the client under client/src/.
      - run: npm run lint

      # The hardcoded-value gate (#26). --report-needless-disables is part of
      # the check rather than a nicety: an exception that stops being needed
      # should fail, or the disable comments become a list nobody prunes.
      - run: npm run lint:css

      # House style does not use an em dash. Ratcheted against a baseline rather
      # than absolute: a rule that could only pass after a mechanical rewrite of
      # every file would have been turned off instead of adopted.
      - run: npm run lint:prose

      # The contract is valid OpenAPI. The API reference and drift-tests' types
      # are both generated from it, so a broken one breaks both.
      - run: npm run lint:api

      # Markdown structure: heading order, list and code fence shape. Prettier
      # owns wrapping and the docs standard owns voice, so rules that overlap
      # with either are off (.markdownlint-cli2.jsonc).
      - run: npm run lint:md

      # Unused files, exports and dependencies, in the service and the client.
      # The client is its own package, so its dependencies are installed too.
      - run: npm ci
        working-directory: client
      - run: npm run knip

  # Every relative link and heading anchor in the markdown resolves. Offline,
  # so the check never fails because an outside site is slow. Its own job on
  # Linux, because the action only downloads a Linux build of lychee.
  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress --hidden --exclude-path node_modules --exclude-path '(^|/)\.git/' './**/*.md'
          fail: true

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - name: Service
        run: npm run typecheck
      - run: npm ci
        working-directory: client
      - name: Client
        working-directory: client
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - name: Service
        run: npm test
      - run: npm ci
        working-directory: client
      - name: Client
        working-directory: client
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, format, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - name: Service
        run: npm run build
      - run: npm ci
        working-directory: client
      - name: Client
        working-directory: client
        run: npm run build

  # End to end, against the built demo bundle. Every other test here stops
  # at a component or an HTTP call: this is the only one that drives the
  # product the way a reader will.
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - name: Install Playwright
        working-directory: client
        run: npx playwright install chromium --with-deps
      - name: End to end
        working-directory: client
        run: npm run e2e
      - name: Keep the trace when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

  # The acceptance suite, drift-tests, against this change: a real server,
  # Redis and Chromium, driven over HTTP with no import from drift. It runs
  # drift-tests' main, or its branch of the same name when one exists, so a
  # change that needs new scenarios can carry them in a drift-tests branch
  # named the same. The generated-types check stays in drift-tests' own CI: a
  # contract change here would fail it until drift-tests regenerates.
  acceptance:
    name: Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Pick the drift-tests branch
        id: suite
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/hipuku/drift-tests "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out drift-tests
        uses: actions/checkout@v7
        with:
          repository: hipuku/drift-tests
          ref: ${{ steps.suite.outputs.ref }}
          path: drift-tests

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            drift-tests/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Start the backend
        env:
          REDIS_URL: redis://127.0.0.1:6379
          PORT: "3001"
          DRIFT_WEBHOOK_ALLOWED_HOSTS: "127.0.0.1"
          DRIFT_CRAWL_ALLOWED_HOSTS: "127.0.0.1"
          DRIFT_WEBHOOK_SECRET: "drift-tests-secret"
        run: |
          npm run dev:server > drift-server.log 2>&1 &
          server=$!
          for i in $(seq 1 45); do
            if ! kill -0 "$server" 2>/dev/null; then
              echo "drift exited before it answered:"; cat drift-server.log; exit 1
            fi
            if [ "$(curl -s --connect-timeout 2 --max-time 5 -o /dev/null -w '%{http_code}' \
                    -X POST localhost:3001/discover -H 'content-type: application/json' -d '{}')" = "400" ]; then
              echo "drift is up"; exit 0
            fi
            sleep 1
          done
          echo "drift did not start:"; cat drift-server.log; exit 1

      - name: Run the acceptance suite (drift-tests ${{ steps.suite.outputs.ref }})
        working-directory: drift-tests
        env:
          DRIFT_URL: http://127.0.0.1:3001
          DRIFT_VERSION: ${{ github.sha }}
        run: |
          npm ci
          npm run test:ci

      - name: Server log
        if: always()
        run: cat drift-server.log || true
